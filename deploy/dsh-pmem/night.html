<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PMem · 夜间</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#070b14;color:#dbe4f5;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8fa0bd;font-size:12.5px;margin-bottom:18px}
  .bar{display:flex;gap:10px;align-items:center;margin:0 0 18px}
  button{background:#1b2740;color:#dbe4f5;border:1px solid #2c3c5e;border-radius:9px;padding:7px 14px;font-size:13px;cursor:pointer}
  button:hover{background:#243352}
  button:disabled{opacity:.5;cursor:default}
  .run{border:1px solid #1e2b45;border-radius:12px;padding:12px 14px;margin:0 0 12px;background:rgba(30,43,69,.35)}
  .run-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .day{font-weight:600}
  .tag{font-size:11.5px;padding:1px 8px;border-radius:99px;background:#1e2b45;color:#9fb4d6}
  .ok{background:#123527;color:#74e0a0}
  .bad{background:#3a1720;color:#ff9aa8}
  .run-err{color:#ff9aa8;font-size:12.5px;margin-top:6px}
  .stages{margin:10px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .stage{border:1px solid #1b2740;border-radius:9px;padding:7px 9px;background:#0c1220}
  .stage .n{font-size:12px;color:#9fb4d6}
  .stage .s{font-size:12.5px;margin-top:2px}
  .stage.done{border-color:#1d4a37}
  .stage.skip{opacity:.55}
  .empty{color:#8fa0bd;padding:24px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>夜间 · 八个阶段</h1>
  <div class="sub">这是 PMem 的睡眠流水：每次跑了哪些阶段、各阶段做了什么、有没有失败。数据来自 <code>pmem sleep log</code>。</div>
  <div class="bar">
    <button id="now">现在入睡</button>
    <button id="reload">刷新</button>
    <span id="msg" class="sub" style="margin:0"></span>
  </div>
  <div id="list"><div class="empty">加载中…</div></div>
</div>
<script>
(function () {
  var list = document.getElementById('list')
  var msg = document.getElementById('msg')
  var now = document.getElementById('now')
  var reload = document.getElementById('reload')

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  }) }

  function stageLabel(name) {
    return ({
      s1_collect: '1 · 收集', s2_dedup: '2 · 去重', s3_relations: '3 · 关系',
      s4_conflicts: '4 · 冲突', s5_patterns: '5 · 规律', s6_traits: '6 · 特质',
      s7_reflect: '7 · 反思', s8_snapshot: '8 · 快照'
    })[name] || name
  }

  function render(d) {
    var runs = (d && d.data && d.data.runs) || []
    if (!runs.length) { list.innerHTML = '<div class="empty">还没有睡眠记录。跑一次「现在入睡」就有。</div>'; return }
    list.innerHTML = runs.map(function (run) {
      var ok = run.status === 'ok'
      var tag = ok ? 'ok' : (run.status === 'running' ? '' : 'bad')
      var stages = (run.stages || []).map(function (s) {
        var name = s.name || s.stage || '?'
        var skipped = s.skipped ? 'skip' : 'done'
        var stat = s.stats ? JSON.stringify(s.stats) : ''
        var ms = typeof s.ms === 'number' ? (s.ms + 'ms') : ''
        return '<div class="stage ' + skipped + '"><div class="n">' + esc(stageLabel(name)) + ' ' + esc(ms) + '</div>'
          + '<div class="s">' + esc(stat.slice(0, 160)) + '</div></div>'
      }).join('')
      return '<div class="run"><div class="run-head"><span class="day">' + esc(run.day) + '</span>'
        + '<span class="tag ' + tag + '">' + esc(run.status) + '</span>'
        + '<span class="tag">' + esc(run.trigger) + '</span>'
        + '<span class="sub" style="margin:0">' + esc(run.started_at) + (run.finished_at ? ' → ' + esc(run.finished_at) : '') + '</span></div>'
        + (run.error ? '<div class="run-err">' + esc(run.error) + '</div>' : '')
        + '<div class="stages">' + stages + '</div></div>'
    }).join('')
  }

  function load() {
    fetch('/dsh-pmem/api/sleep', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.json() })
      .then(render)
      .catch(function (e) { list.innerHTML = '<div class="empty">读不到睡眠记录：' + esc(e.message) + '</div>' })
  }

  now.addEventListener('click', function () {
    now.disabled = true
    msg.textContent = '正在跑一轮睡眠…（八个阶段，可能要几十秒）'
    fetch('/dsh-pmem/api/sleep/now', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      .then(function (r) { return r.json() })
      .then(function (d) {
        msg.textContent = d && d.ok ? '跑完了' : ('失败：' + ((d && d.error) || '未知'))
        load()
      })
      .catch(function (e) { msg.textContent = '失败：' + e.message })
      .finally(function () { now.disabled = false })
  })
  reload.addEventListener('click', load)
  load()
})()
</script>
</body>
</html>
