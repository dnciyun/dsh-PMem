[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmem"
version = "0.41.0"
description = "dsh-PMem 路 鍙鎬ц蹇?鈥斺€?缁欎綘瀹堕偅鏉″ぇ鑲ラ奔鐨勮蹇嗗櫒瀹橈細鍘熻瘽璁板緱浣忥紝鍑哄鏌ュ緱鍒帮紝璇撮敊浜嗚兘鎾ゅ洖"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "dnciyun" }]
dependencies = []

[project.optional-dependencies]
# 鏍稿績闆朵緷璧栵紱浠ヤ笅鎸夐渶瀹夎
# 鍚戦噺閫氶亾锛堝彲閫夛級锛氫笉瑁呬篃鑳借窇璇嶆硶閾捐矾锛屽彧鏄涔夋敼鍐欑被闂浼氬急涓€浜?
vector = ["numpy>=1.24", "onnxruntime>=1.16"]
embed = ["sentence-transformers>=2.2", "jieba>=0.42"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
pmem = "pmem.gate.cli:main"

[project.urls]
Homepage = "https://github.com/dnciyun/dsh-PMem"
Repository = "https://github.com/dnciyun/dsh-PMem"
Issues = "https://github.com/dnciyun/dsh-PMem/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
